[package]
name = "ctx-budget"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ctx-budget"
path = "src/main.rs"

[dependencies]
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
atty = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true


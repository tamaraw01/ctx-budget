[package]
name = "ctx-budget"
version = "0.3.1"
edition = "2021"
rust-version = "1.70"
description = "Analyze token distribution across your codebase to plan LLM context usage before hitting limits"
license = "GPL-3.0"
repository = "https://github.com/tamaraw01/ctx-budget"
homepage = "https://github.com/tamaraw01/ctx-budget"
readme = "README.md"
keywords = ["llm", "tokens", "context-window", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
authors = ["ctx-budget maintainers"]
exclude = ["/target", ".github/assets"]

[[bin]]
name = "ctx-budget"
path = "src/main.rs"

[dependencies]
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["clock"] }
csv = "1"
is-terminal = "0.4"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

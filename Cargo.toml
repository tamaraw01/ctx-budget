[package]
name = "ctx-budget"
version = "0.1.0"
edition = "2021"
description = "Token budget analyzer for LLM contexts"
repository = "https://github.com/aditama-next/ctx-budget"
license = "MIT"
authors = ["Augie <augie@domain.local>"]

[[bin]]
name = "ctx-budget"
path = "src/main.rs"

[dependencies]
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true

name: Feature Request
description: Suggest an enhancement to ctx-budget
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the feature request!

  - type: textarea
    attributes:
      label: Problem Statement
      description: Describe the problem this feature solves
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: How should this feature work?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered

  - type: textarea
    attributes:
      label: Use Cases
      description: Real-world scenarios where this would help

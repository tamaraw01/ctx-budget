name: Bug Report
description: Report an issue with ctx-budget
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue!

  - type: input
    attributes:
      label: Version
      description: What version are you using?
      placeholder: "0.2.0"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear description of what went wrong
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        Steps to reproduce the behavior:
        1. Run '...'
        2. See error '...'
      value: |
        1.
        2.
        3.

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: System Information
      description: |
        Include relevant system details:
        - OS: (Linux, macOS, Windows)
        - Rust version: (run `rustc --version`)
        - Architecture: (x86_64, aarch64, etc.)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Context
      description: Any additional information (logs, output, etc.)

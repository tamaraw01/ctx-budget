name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release
      - run: cp target/release/ctx-budget ctx-budget-linux-x86_64
      - uses: softprops/action-gh-release@v1
        with:
          files: ctx-budget-linux-x86_64
